services:
  spark_agent:
    container_name: spark_agent_qa
    build:
      context: .
      dockerfile: Dockerfile
    image: spark_agent:qa
    restart: unless-stopped
    env_file:
      - .env.qa
    environment:
      - HF_HOME=/root/.cache/huggingface
      - SENTENCE_TRANSFORMERS_HOME=/root/.cache/huggingface
      - EMBEDDING_CACHE_DIR=/root/.cache/huggingface
      - WHISPER_SERVER_URL=http://whisper_server:9000
    volumes:
      - .:/app
      - embedding_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 10s
    networks:
      - traefik-net
      - whisper-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.spark_agent_qa.entrypoints=websecure"
      - "traefik.http.routers.spark_agent_qa.rule=Host(`${DOMAIN:-mia-dev.evaspark.com}`)"
      - "traefik.http.routers.spark_agent_qa.tls=true"
      - "traefik.http.routers.spark_agent_qa.tls.certresolver=letsencrypt"
      - "traefik.http.routers.spark_agent_qa.service=spark-agent-qa-service"
      - "traefik.http.services.spark-agent-qa-service.loadbalancer.server.port=8000"

  # ── Servidor whisper.cpp — solo red interna, sin puerto expuesto ──
  whisper:
    image: ghcr.io/ggerganov/whisper.cpp:main
    container_name: whisper_server
    volumes:
      - whisper_models:/models
      - ./scripts/whisper-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - whisper-net
    restart: unless-stopped

networks:
  traefik-net:
    external: true
  whisper-net:
    name: spark_agent_whisper_net

volumes:
  embedding_cache:
    name: spark_agent_embedding_cache
  whisper_models:
    name: spark_agent_whisper_models
