services:
  spark_agent:
    container_name: spark_agent_dev
    build:
      context: .
      dockerfile: Dockerfile
    image: spark_agent:dev
    ports:
      - "2545:8000"
    env_file:
      - .env.dev
    environment:
      - HF_HOME=/root/.cache/huggingface
      - SENTENCE_TRANSFORMERS_HOME=/root/.cache/huggingface
      - EMBEDDING_CACHE_DIR=/root/.cache/huggingface
    volumes:
      - .:/app
      - embedding_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  embedding_cache:
    name: spark_agent_embedding_cache

