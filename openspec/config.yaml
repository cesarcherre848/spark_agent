schema: spec-driven

# Project context
context: |
  Project: spark_agent
  Tech stack: Python 3.9+, LangGraph, LangChain, Pydantic v2, PostgreSQL (pgvector, psycopg-pool), Pytest.
  Domain: Multi-agent conversational system for customer service, product catalog retrieval (RAG), sales management, and CRM (Odoo).
  Conventions:
    - Planning boundary: Do not modify source code or tests during proposal/planning workflows.
    - Test runner: Run unit tests with `.venv/bin/pytest -m "not real_db"`.
    - Architecture: LangGraph multi-agent graph with modular subgraphs in `src/agent_service/graph/`.

